name: CI — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify data file
        run: |
          test -f api/data.json || (echo "api/data.json not found" && exit 1)
          python -c "import json; json.load(open('api/data.json', encoding='utf-8')); print('JSON valid')"

      - name: Run data tests
        run: python api/test_api.py

      - name: Run data quality pipeline
        run: python pipelines/validate_data.py api/data.json

      - name: Start API server
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Smoke test — health
        run: |
          resp=$(curl -sf http://localhost:8000/health)
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy', 'Unhealthy'; print('Health OK')"

      - name: Smoke test — levels
        run: |
          resp=$(curl -sf http://localhost:8000/api/v1/levels)
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and d['total']>=12; print(f'Levels OK: {d[\"total\"]}')"

      - name: Smoke test — subjects
        run: |
          resp=$(curl -sf http://localhost:8000/api/v1/subjects)
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and d['total']>=50; print(f'Subjects OK: {d[\"total\"]}')"

      - name: Smoke test — content
        run: |
          resp=$(curl -sf "http://localhost:8000/api/v1/content?limit=5")
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and d['total']>=500; print(f'Content OK: {d[\"total\"]}')"

      - name: Smoke test — search
        run: |
          resp=$(curl -sf "http://localhost:8000/api/v1/search?q=math")
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['success'] and d['total_results']>0; print(f'Search OK: {d[\"total_results\"]} results')"

      - name: Smoke test — stats
        run: |
          resp=$(curl -sf http://localhost:8000/api/v1/stats)
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d['success']; print('Stats OK')"

      - name: Summary
        if: success()
        run: |
          echo "================================"
          echo "ALL TESTS PASSED"
          echo "================================"

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment notification
        run: |
          echo "Tests passed — Railway will auto-deploy from GitHub"
          echo "Dashboard: https://railway.app/dashboard"
