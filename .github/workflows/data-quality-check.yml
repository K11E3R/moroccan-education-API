name: Daily Data Quality Check

on:
  schedule:
    - cron: "0 6 * * *"  # Every day at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  quality-check:
    name: Validate Data Quality
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data quality pipeline
        run: python pipelines/validate_data.py api/data.json

      - name: Run test suite
        run: python api/test_api.py

      - name: Start API and verify endpoints
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          
          echo "--- Health Check ---"
          curl -sf http://localhost:8000/health | python -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2))"
          
          echo "--- Stats ---"
          curl -sf http://localhost:8000/api/v1/stats | python -c "
          import sys,json
          d=json.load(sys.stdin)['data']
          print(f\"Levels: {d['total_levels']}\")
          print(f\"Subjects: {d['total_subjects']}\")
          print(f\"Content: {d['total_content']}\")
          print(f\"Quality: {d.get('quality_score', 'N/A')}\")
          "

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: pipelines/quality_report.json
          retention-days: 30
